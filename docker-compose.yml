services:
  postgres:
    image: postgres:17
    container_name: logitrack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: logitrack
      POSTGRES_USER: logitrack_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack_user -d logitrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
